name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Configure Bioconductor repositories
        run: |
          install.packages("BiocManager")
          repos <- BiocManager::repositories()
          cat(
            "options(repos = ", deparse(repos), ")\n",
            file = path.expand("~/.Rprofile"),
            append = TRUE
          )
        shell: Rscript {0}

      - name: Install remotes
        run: install.packages("remotes")
        shell: Rscript {0}

      - name: Install pryr from CRAN archive (removed from CRAN)
        run: |
          remotes::install_url(
            "https://cran.r-project.org/src/contrib/Archive/pryr/pryr_0.1.6.tar.gz",
            upgrade = "never"
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            github::anderssonlab/PRIME
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4