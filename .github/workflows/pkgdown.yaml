name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install system libraries (common Bioconductor / rtracklayer deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev
        shell: bash

      - name: Install R tooling
        run: |
          install.packages(c("remotes", "pkgdown"))
          install.packages("BiocManager")
        shell: Rscript {0}

      - name: Install pryr from CRAN archive (required by CAGEfightR)
        run: |
          remotes::install_url(
            "https://cran.r-project.org/src/contrib/Archive/pryr/pryr_0.1.6.tar.gz",
            upgrade = "never"
          )
        shell: Rscript {0}

      - name: Install Bioconductor dependencies (incl. CAGEfightR)
        run: |
          BiocManager::install(c("CAGEfightR"), update = FALSE, ask = FALSE)
        shell: Rscript {0}

      - name: Install PRIME from GitHub
        run: |
          remotes::install_github("anderssonlab/PRIME", upgrade = "never")
        shell: Rscript {0}

      - name: Install PRIMEmodel
        run: |
          remotes::install_local(".", upgrade = "never")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4